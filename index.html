<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agri-Manager Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #10b981; /* Vert Émeraude Pro */
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --danger: #ef4444;
            --border: #334155;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding-bottom: 120px; /* Espace pour le total en bas */
        }

        /* En-tête Pro */
        header {
            background: rgba(30, 41, 59, 0.9);
            backdrop-filter: blur(10px);
            padding: 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 { margin: 0; font-size: 1.2rem; font-weight: 800; color: var(--accent); letter-spacing: -0.5px; }
        .subtitle { font-size: 0.8rem; color: var(--text-muted); font-weight: 400; }

        .btn-print {
            background: transparent;
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 8px 15px;
            border-radius: 8px;
            font-size: 0.8rem;
            cursor: pointer;
        }

        /* Zone Photo discrète */
        .scan-trigger {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            margin: 15px;
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);
            cursor: pointer;
        }
        #preview { width: 100%; border-radius: 8px; margin-top: 10px; display: none; border: 2px solid var(--border); }

        /* Le Tableau Pro */
        .table-container { padding: 0 15px; }
        
        .entry-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            border: 1px solid var(--border);
            transition: transform 0.1s;
        }

        .input-group { flex: 1; }
        .input-group label { display: block; font-size: 0.7rem; color: var(--text-muted); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
        
        input {
            width: 100%;
            background: #0f172a;
            border: 1px solid var(--border);
            color: white;
            padding: 10px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            box-sizing: border-box;
            outline: none;
        }
        input:focus { border-color: var(--accent); }

        .line-total {
            font-weight: 800;
            color: var(--accent);
            font-size: 1.1rem;
            min-width: 80px;
            text-align: right;
        }

        .btn-del {
            color: var(--danger);
            background: rgba(239, 68, 68, 0.1);
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        /* Barre de Total Flottante (Style App Bancaire) */
        .floating-footer {
            position: fixed;
            bottom: 20px;
            left: 5%;
            width: 90%;
            background: var(--accent);
            color: #064e3b;
            padding: 15px 20px;
            border-radius: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 10px 25px rgba(16, 185, 129, 0.4);
            box-sizing: border-box;
            z-index: 200;
        }

        .total-label { font-size: 0.8rem; font-weight: 600; text-transform: uppercase; opacity: 0.8; }
        .grand-total { font-size: 1.4rem; font-weight: 800; }
        
        .btn-add {
            background: #064e3b;
            color: white;
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 12px;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        /* Mode Impression */
        @media print {
            body { background: white; color: black; padding: 0; }
            header, .floating-footer, .btn-del, .scan-trigger { display: none; }
            .entry-card { border: 1px solid #ccc; break-inside: avoid; background: white; color: black; box-shadow: none; }
            input { border: none; background: transparent; color: black; }
            .print-header { display: block !important; text-align: center; margin-bottom: 20px; border-bottom: 2px solid black; padding-bottom: 10px; }
        }
    </style>
</head>
<body>

<header>
    <div>
        <h1>Agri-Manager</h1>
        <div class="subtitle">Gestion Commerciale Pro</div>
    </div>
    <button class="btn-print" onclick="window.print()">🖨️ Imprimer</button>
</header>

<div class="print-header" style="display:none;">
    <h2>Bilan des Ventes</h2>
    <p>Date: <span id="datePrint"></span></p>
</div>

<div class="scan-trigger" onclick="document.getElementById('fileInput').click()">
    📷 Ouvrir Cahier / Photo
</div>
<input type="file" id="fileInput" accept="image/*" style="display:none" onchange="handleImage(event)">
<div style="padding: 0 15px;"><img id="preview"></div>

<div class="table-container" id="listeVentes">
    </div>

<div class="floating-footer">
    <div>
        <div class="total-label">Chiffre d'Affaires</div>
        <div class="grand-total"><span id="grandTotal">0</span> <small>GNF</small></div>
    </div>
    <button class="btn-add" onclick="ajouterLigne()">+</button>
</div>

<script>
    // 1. Charger les données sauvegardées au démarrage
    window.onload = function() {
        const savedData = localStorage.getItem('agriData');
        if (savedData) {
            document.getElementById('listeVentes').innerHTML = savedData;
            reattachEvents(); // Réactiver les calculs
            calculerTotalGeneral();
        } else {
            ajouterLigne(); // Une ligne vide au début
        }
        document.getElementById('datePrint').innerText = new Date().toLocaleDateString();
    };

    // 2. Ajouter une nouvelle "Carte" de vente
    function ajouterLigne() {
        const div = document.createElement('div');
        div.className = 'entry-card';
        div.innerHTML = `
            <div class="input-group">
                <label>Prix (GNF)</label>
                <input type="number" placeholder="0" oninput="calculer(this)">
            </div>
            <div style="font-size:1.2rem; color:#94a3b8;">×</div>
            <div class="input-group" style="flex:0.6">
                <label>Qté</label>
                <input type="number" placeholder="0" oninput="calculer(this)">
            </div>
            <div class="line-total">0</div>
            <button class="btn-del" onclick="supprimer(this)">×</button>
        `;
        document.getElementById('listeVentes').appendChild(div);
        div.querySelector('input').focus();
        sauvegarder();
    }

    // 3. Le cerveau : Calcul instantané
    function calculer(input) {
        const card = input.closest('.entry-card');
        const inputs = card.querySelectorAll('input');
        const prix = parseFloat(inputs[0].value) || 0;
        const qte = parseFloat(inputs[1].value) || 0;
        const total = prix * qte;

        // Mise à jour visuelle
        card.querySelector('.line-total').innerText = total.toLocaleString('fr-FR');
        
        // Mise à jour globale
        calculerTotalGeneral();
        sauvegarder();
    }

    // 4. Calcul du Total Vert en bas
    function calculerTotalGeneral() {
        let total = 0;
        document.querySelectorAll('.entry-card').forEach(card => {
            const inputs = card.querySelectorAll('input');
            const prix = parseFloat(inputs[0].value) || 0;
            const qte = parseFloat(inputs[1].value) || 0;
            total += (prix * qte);
        });
        document.getElementById('grandTotal').innerText = total.toLocaleString('fr-FR');
    }

    // 5. Supprimer
    function supprimer(btn) {
        if(confirm('Supprimer cette ligne ?')) {
            btn.closest('.entry-card').remove();
            calculerTotalGeneral();
            sauvegarder();
        }
    }

    // 6. Gestion Photo
    function handleImage(event) {
        const file = event.target.files[0];
        if (file) {
            const img = document.getElementById('preview');
            img.src = URL.createObjectURL(file);
            img.style.display = 'block';
        }
    }

    // 7. Système de Sauvegarde (LocalStorage)
    function sauvegarder() {
        const content = document.getElementById('listeVentes').innerHTML;
        // On sauvegarde le HTML pour le retrouver après, mais attention, les valeurs des inputs doivent être mises dans l'attribut 'value' pour être sauvées
        document.querySelectorAll('input').forEach(input => {
            input.setAttribute('value', input.value);
        });
        localStorage.setItem('agriData', document.getElementById('listeVentes').innerHTML);
    }

    // Réattacher les événements après rechargement
    function reattachEvents() {
        document.querySelectorAll('input').forEach(input => {
            input.oninput = function() { calculer(this); };
        });
    }
</script>

</body>
</html>

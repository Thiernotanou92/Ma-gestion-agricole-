<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agri-Expert Guinée (Multi-Calcul)</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
    <style>
        body { font-family: sans-serif; background-color: #0f172a; color: white; padding: 10px; }
        .card { background: #1e293b; padding: 15px; border-radius: 15px; border: 2px solid #3b82f6; }
        .scan-btn { background: #3b82f6; color: white; padding: 18px; border-radius: 12px; text-align: center; font-weight: bold; cursor: pointer; margin-bottom: 15px; display: block; }
        .loader { display: none; color: #fbbf24; text-align: center; margin: 10px; font-weight: bold; }
        table { width: 100%; margin-top: 15px; border-collapse: collapse; background: #0f172a; border-radius: 8px; overflow: hidden; }
        th, td { border: 1px solid #334155; padding: 10px; text-align: right; font-size: 0.85em; }
        th { background: #3b82f6; text-align: center; }
        .final-result { background: #22c55e; color: #052e16; padding: 20px; border-radius: 12px; text-align: center; margin-top: 20px; font-size: 1.4em; font-weight: bold; border: 3px solid white; }
        #preview { width: 100%; border-radius: 10px; margin-top: 10px; display: none; }
    </style>
</head>
<body>

<div class="card">
    <h2 style="text-align:center; margin-top:0;">📊 Calculateur de Cahier</h2>
    
    <label class="scan-btn">
        🔍 SCANNER MON CAHIER
        <input type="file" accept="image/*" style="display:none" onchange="traiterCahier(event)">
    </label>

    <div id="loader" class="loader">⏳ Lecture du cahier en cours...</div>
    <img id="preview">

    <table id="resultTable">
        <thead>
            <tr>
                <th style="text-align:left">Ligne détectée</th>
                <th>Sous-Total (GNF)</th>
            </tr>
        </thead>
        <tbody>
            </tbody>
    </table>

    <div class="final-result">
        TOTAL GÉNÉRAL : <br>
        <span id="grandTotal">0</span> GNF
    </div>
    
    <button onclick="window.location.reload()" style="width:100%; background:transparent; color: #94a3b8; border:none; margin-top:15px; text-decoration:underline;">Effacer et recommencer</button>
</div>

<script>
    async function traiterCahier(event) {
        const file = event.target.files[0];
        if (!file) return;

        document.getElementById('preview').src = URL.createObjectURL(file);
        document.getElementById('preview').style.display = 'block';
        document.getElementById('loader').style.display = 'block';
        document.querySelector('#resultTable tbody').innerHTML = "";

        try {
            const result = await Tesseract.recognize(file, 'fra');
            const lignes = result.data.text.split('\n');
            let totalGeneral = 0;

            lignes.forEach(ligne => {
                // On cherche les lignes qui ressemblent à : 300.000 x 20
                // On extrait les nombres
                const nombres = ligne.replace(/\s/g, '').match(/\d+/g);
                
                if (nombres && nombres.length >= 2) {
                    const prix = parseInt(nombres[0]);
                    const quantite = parseInt(nombres[1]);
                    
                    if (prix > 100 && quantite > 0) { // Pour éviter les dates comme 2019
                        const sousTotal = prix * quantite;
                        totalGeneral += sousTotal;

                        const tr = `<tr>
                            <td style="text-align:left">${prix.toLocaleString()} x ${quantite}</td>
                            <td>${sousTotal.toLocaleString()}</td>
                        </tr>`;
                        document.querySelector('#resultTable tbody').innerHTML += tr;
                    }
                }
            });

            document.getElementById('grandTotal').innerText = totalGeneral.toLocaleString();

        } catch (e) {
            alert("Erreur d'analyse. Assurez-vous que la photo est nette.");
        }
        document.getElementById('loader').style.display = 'none';
    }
</script>

</body>
</html>

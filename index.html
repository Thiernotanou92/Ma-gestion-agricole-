<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion Agricole Pro - Guinée</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: white; padding: 15px; }
        .card { background: #1e1e1e; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        h2 { text-align: center; color: #4CAF50; }
        label { display: block; margin-top: 10px; font-size: 0.9em; color: #bbb; }
        input { width: 100%; padding: 12px; margin-top: 5px; border-radius: 8px; border: 1px solid #333; background: #252525; color: white; box-sizing: border-box; }
        button { width: 100%; padding: 15px; margin-top: 20px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; }
        .btn-add { background-color: #4CAF50; color: white; }
        .btn-clear { background-color: #f44336; color: white; margin-top: 10px; }
        table { width: 100%; margin-top: 20px; border-collapse: collapse; font-size: 0.8em; }
        th, td { border: 1px solid #333; padding: 8px; text-align: center; }
        th { background: #333; }
        .total-box { margin-top: 20px; padding: 15px; background: #333; border-radius: 10px; text-align: center; }
        .profit { color: #4CAF50; font-size: 1.2em; font-weight: bold; }
    </style>
</head>
<body>

<div class="card">
    <h2>🚜 Ma Vente Agricole</h2>
    
    <label>Nom du Produit (ex: Tomate)</label>
    <input type="text" id="produit" placeholder="Ex: Melon">

    <label>Quantité Arrivée</label>
    <input type="number" id="arrivage" placeholder="0">

    <label>Quantité Vendue</label>
    <input type="number" id="vendu" placeholder="0">

    <label>Pertes (Gâtés)</label>
    <input type="number" id="pertes" placeholder="0" value="0">

    <label>Prix Unitaire (GNF)</label>
    <input type="number" id="prix" placeholder="0">

    <label>Total Dépenses (Police, Magasin...)</label>
    <input type="number" id="depenses" placeholder="0" value="0">

    <button class="btn-add" onclick="ajouterVente()">➕ Enregistrer la Vente</button>
</div>

<div class="total-box">
    Bénéfice Net Total : <br>
    <span id="grandTotal" class="profit">0</span> GNF
</div>

<table id="tableVentes">
    <thead>
        <tr>
            <th>Produit</th>
            <th>Stock</th>
            <th>Total</th>
            <th>Reste</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>

<button class="btn-clear" onclick="effacerTout()">🗑 Effacer tout l'historique</button>

<script>
    let historique = JSON.parse(localStorage.getItem('ventesAgri')) || [];
    updateTable();

    function ajouterVente() {
        const produit = document.getElementById('produit').value;
        const arrivage = parseFloat(document.getElementById('arrivage').value) || 0;
        const vendu = parseFloat(document.getElementById('vendu').value) || 0;
        const pertes = parseFloat(document.getElementById('pertes').value) || 0;
        const prix = parseFloat(document.getElementById('prix').value) || 0;
        const depenses = parseFloat(document.getElementById('depenses').value) || 0;

        if(!produit || prix <= 0) { alert("Remplis au moins le nom et le prix !"); return; }

        const stock = arrivage - vendu - pertes;
        const totalArgent = vendu * prix;
        const resteFinal = totalArgent - depenses;

        const nouvelleVente = { produit, stock, totalArgent, resteFinal };
        historique.push(nouvelleVente);
        localStorage.setItem('ventesAgri', JSON.stringify(historique));
        
        updateTable();
        clearInputs();
    }

    function updateTable() {
        const tbody = document.querySelector('#tableVentes tbody');
        tbody.innerHTML = "";
        let grandTotal = 0;

        historique.forEach(v => {
            const row = `<tr>
                <td>${v.produit}</td>
                <td>${v.stock}</td>
                <td>${v.totalArgent.toLocaleString()}</td>
                <td><strong>${v.resteFinal.toLocaleString()}</strong></td>
            </tr>`;
            tbody.innerHTML += row;
            grandTotal += v.resteFinal;
        });

        document.getElementById('grandTotal').innerText = grandTotal.toLocaleString();
    }

    function clearInputs() {
        document.getElementById('produit').value = "";
        document.getElementById('arrivage').value = "";
        document.getElementById('vendu').value = "";
        document.getElementById('pertes').value = "0";
        document.getElementById('prix').value = "";
        document.getElementById('depenses').value = "0";
    }

    function effacerTout() {
        if(confirm("Supprimer toutes les données ?")) {
            historique = [];
            localStorage.removeItem('ventesAgri');
            updateTable();
        }
    }
</script>

</body>
</html>
